name: Auto Create and Merge PR

on:
  push:
    branches: [ main ]

jobs:
  make-pull-request:         # 1. Your job name
    runs-on: ubuntu-latest
    permissions:             # 2. ADD THIS BLOCK HERE (indented under the job name)
      contents: write
      pull-requests: write

    steps:                   # 3. Your existing steps follow below
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-generated-branch
          title: "Automated PR"
          body: "Auto-generated pull request for hackathon project."